AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Genesis — scaffold a starter repo from a plan (Phase 10)

Resources:
  GenesisFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 60
      # No ReservedConcurrentExecutions, Lambda requires at least 10 unreserved, account limit is 10
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - https://jborrajo21.github.io
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type, anthropic-api-key]
          ExposeHeaders: [content-disposition, genesis-supported]
          MaxAge: 86400

    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
      DockerTag: genesis-lambda
      DockerBuildTarget: lambda

Outputs:
  FunctionUrl:
    Description: Public HTTPS endpoint
    Value: !GetAtt GenesisFunctionUrl.FunctionUrl
