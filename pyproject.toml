[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genesis"
version = "0.1.0"
description = "Project Scaffolding Agent"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
anthropic = ["anthropic"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds a generated repo in a real venv (needs network; ~7s)"]