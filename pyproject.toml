[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genesis-agent"
version = "0.1.3"
description = "Turn a project idea into a structured plan and a starter repo that provably builds"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Borrajo", email = "jborrajof@gmail.com" }]
keywords = ["scaffolding", "cli", "codegen", "llm", "project-template"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jborrajo21/genesis"
Repository = "https://github.com/jborrajo21/genesis"
Issues = "https://github.com/jborrajo21/genesis/issues"

[project.scripts]
genesis = "genesis.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
anthropic = ["anthropic>=0.119"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds a generated repo in a real venv (needs network; ~7s)"]

[tool.hatch.build.targets.wheel]
packages = ["src/genesis"]

[tool.mypy]
files = ["src/genesis"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true