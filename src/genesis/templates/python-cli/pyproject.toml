[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greetly"
version = "0.1.0"
description = "A small command-line tool"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
greetly = "greetly.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
disallow_untyped_defs = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
