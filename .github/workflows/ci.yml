name: CI

on: [push, pull_request]

jobs:
    template:
        runs-on: ubuntu-latest
        defaults: 
            run: 
                working-directory: src/genesis/templates/python-cli
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            - run: pip install -e ".[dev]"
            - run: ruff check .
            - run: ruff format --check .
            - run: pytest
    genesis:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            - run: pip install -e ".[dev]"
            - run: ruff check .
            - run: ruff format --check .
            - run: pytest
    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: docker build -t genesis:ci .
            - run: docker run --rm genesis:ci --version
            - name: template ships inside the image
              run: >
                docker run --rm --entrypoint python genesis:ci -c
                "from genesis.scaffolder import _TEMPLATE_DIR;
                assert _TEMPLATE_DIR.is_dir(), _TEMPLATE_DIR"
            - name: scaffold and build inside the container
              run: >
                docker run --rm -v "$PWD/ci:/plan:ro" genesis:ci
                scaffold /plan/plan.json out
                