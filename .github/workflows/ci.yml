name: CI

on: [push, pull_request]

jobs:
    template:
        runs-on: ubuntu-latest
        defaults: 
            run: 
                working-directory: src/genesis/templates/python-cli
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            - run: pip install -e ".[dev]"
            - run: ruff check .
            - run: ruff format --check .
            - run: pytest
    genesis:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                python-version: "3.11"
            - run: pip install -e ".[dev,anthropic]"
            - run: ruff check .
            - run: ruff format --check .
            - run: mypy
            - run: pytest
            - name: end-to-end plan and scaffold against a stub model server
              run: |
                python ci/stub_server.py &
                for _ in $(seq 40); do curl -sf http://127.0.0.1:8765/ >/dev/null && break; sleep 0.25; done
                GENESIS_OLLAMA_BASE_URL=http://127.0.0.1:8765/v1 \
                  genesis create "a cli todo app" out --adapter ollama --model stub --force
    docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: docker build -t genesis:ci .
            - run: docker run --rm genesis:ci --version
            - name: every registered template ships inside the image
              run: >
                docker run --rm --entrypoint python genesis:ci -c
                "from genesis.template_registry import TEMPLATES, template_dir;
                assert all(template_dir(t).is_dir() for t in TEMPLATES), TEMPLATES"
            - name: scaffold and build inside the container
              run: >
                docker run --rm -v "$PWD/ci:/plan:ro" genesis:ci
                scaffold /plan/plan.json out
            - run: docker build --target lambda -t genesis:lambda-ci .
            - name: the lambda image carries the runtime client and the handler
              run: >
                docker run --rm --entrypoint python genesis:lambda-ci -c
                "import awslambdaric, genesis.lambda_handler"
            - name: the handler scaffolds a repo inside the lambda image
              run: >
                docker run --rm -v "$PWD/tests/fixtures:/f:ro"
                --entrypoint python genesis:lambda-ci -c
                "import base64, io, json, zipfile;
                from genesis.lambda_handler import handler;
                r = handler(json.load(open('/f/scaffold_event.json')), None);
                assert r['statusCode'] == 200, r;
                z = zipfile.ZipFile(io.BytesIO(base64.b64decode(r['body'])));
                assert any(n.endswith('pyproject.toml') for n in z.namelist()), z.namelist()"
                